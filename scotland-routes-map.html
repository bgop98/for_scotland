<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scottish Highlands seasonal route map</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: Canvas;
      --foreground: CanvasText;
      --card: color-mix(in srgb, CanvasText 5%, Canvas);
      --card-foreground: CanvasText;
      --muted: color-mix(in srgb, CanvasText 10%, transparent);
      --muted-foreground: color-mix(in srgb, CanvasText 68%, transparent);
      --border: color-mix(in srgb, CanvasText 24%, transparent);
      --viz-series-1: LinkText;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: var(--background); color: var(--foreground); font-family: system-ui, sans-serif; }
    h1, h2, h3, p { margin-top: 0; }
    .form-label { display: grid; gap: 5px; min-width: 180px; font-weight: 500; }
    .form-select { width: 100%; padding: 8px 34px 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); color: var(--foreground); font: inherit; }
    .viz-controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .card { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--card-foreground); }
    .text-small { font-size: 0.875rem; }
    @media (max-width: 520px) { body { padding: 10px; } .viz-controls, .form-label { width: 100%; } }
  </style>
</head>
<body>
<div id="scotland-route-options">
  <style>
    #scotland-route-options { color: var(--foreground); width: 100%; }
    #scotland-route-options .route-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    #scotland-route-options .route-head h2 { margin: 0; }
    #scotland-route-options .route-meta { color: var(--muted-foreground); }
    #scotland-route-options .map-wrap { position: relative; width: 100%; }
    #scotland-route-options .route-map { display: block; width: 100%; }
    #scotland-route-options .land { fill: color-mix(in srgb, var(--muted) 72%, transparent); stroke: var(--border); stroke-width: 0.75; vector-effect: non-scaling-stroke; }
    #scotland-route-options .route-road, #scotland-route-options .route-ferry { fill: none; stroke: var(--viz-series-1); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #scotland-route-options .route-ferry { stroke-dasharray: 7 6; }
    #scotland-route-options .route-halo { fill: none; stroke: var(--background); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #scotland-route-options .stop-dot { fill: var(--background); stroke: var(--viz-series-1); stroke-width: 2.5; vector-effect: non-scaling-stroke; cursor: pointer; }
    #scotland-route-options .stop-dot.is-selected { fill: var(--viz-series-1); stroke: var(--foreground); }
    #scotland-route-options .stop-number { fill: var(--foreground); font-weight: 500; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    #scotland-route-options .stop-number.is-selected { fill: var(--background); }
    #scotland-route-options .place-label { fill: var(--muted-foreground); font-weight: 400; pointer-events: none; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
    #scotland-route-options .map-note { fill: var(--muted-foreground); }
    #scotland-route-options .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; color: var(--muted-foreground); margin-top: 4px; }
    #scotland-route-options .legend-line { display: inline-block; width: 30px; border-top: 3px solid var(--viz-series-1); margin-right: 7px; vertical-align: middle; }
    #scotland-route-options .legend-line.ferry { border-top-style: dashed; }
    #scotland-route-options .stop-card { margin-top: 12px; }
    #scotland-route-options .stop-card h3 { margin: 0 0 4px; }
    #scotland-route-options .stop-card p { margin: 0; color: var(--muted-foreground); }
    @media (max-width: 520px) {
      #scotland-route-options .place-label { display: none; }
      #scotland-route-options .route-road, #scotland-route-options .route-ferry { stroke-width: 2.5; }
    }
  </style>

  <div class="route-head">
    <div>
      <h2>Scottish Highlands route options</h2>
      <div id="route-meta" class="route-meta text-small"></div>
    </div>
    <div class="viz-controls" aria-label="Route choices">
      <label class="form-label" for="season-choice">Season
        <select id="season-choice" class="form-select">
          <option value="february" selected>February · winter into spring</option>
          <option value="march">March · early spring</option>
          <option value="october">October · autumn</option>
          <option value="november">November · late autumn</option>
        </select>
      </label>
      <label class="form-label" for="route-choice">Trip length
        <select id="route-choice" class="form-select">
          <option value="18">18 days</option>
          <option value="21">21 days</option>
          <option value="24">24 days</option>
          <option value="28">4 weeks</option>
          <option value="35" selected>5 weeks</option>
          <option value="42">6 weeks</option>
        </select>
      </label>
    </div>
  </div>

  <div class="map-wrap">
    <svg id="route-map" class="route-map" role="img" aria-labelledby="route-map-title route-map-desc">
      <title id="route-map-title">Scottish Highlands road-trip route</title>
      <desc id="route-map-desc">Select a season and trip length to compare overnight bases, road connections and ferry crossings.</desc>
    </svg>
  </div>

  <div class="legend text-small" aria-label="Map legend">
    <span><span class="legend-line"></span>Road connection</span>
    <span><span class="legend-line ferry"></span>Vehicle ferry</span>
    <span>Numbered circles are overnight bases</span>
  </div>

  <div id="stop-card" class="card stop-card" aria-live="polite">
    <h3 id="stop-name"></h3>
    <p id="stop-detail"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

        18: makeRoute('18 days','15 March–1 April','Compact west-coast journey with Skye reached by bridge.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray',2],['oban',2],['glencoe',3],['skye',2],['inverness',1]]),
        21: makeRoute('21 days','15 March–4 April','Adds Arisaig and another Skye night.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray',2],['oban',2],['glencoe',3],['arisaig',1],['skye',3],['inverness',2]]),
        24: makeRoute('24 days','15 March–7 April','Introduces Mull with a three-night island base.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray',2],['oban',2],['mull',3],['glencoe',3],['arisaig',1],['skye',3],['inverness',1],['cairngorms',1]]),
        28: makeRoute('4 weeks','15 March–11 April','Adds Torridon and a longer Skye stay.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray',2],['oban',2],['mull',3],['glencoe',3],['arisaig',1],['skye',4],['torridon',2],['inverness',1],['cairngorms',2]]),
        35: makeRoute('5 weeks','15 March–18 April','Extends the northwest to Ullapool with multi-night island and mountain bases.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray_kilmartin',3],['oban',3],['mull',4],['glencoe',3],['arisaig',2],['skye',4],['torridon',2],['ullapool',2],['inverness',2],['cairngorms',2]]),
        42: makeRoute('6 weeks','15 March–25 April','The longest early-spring route adds Assynt and Durness.',[['edinburgh',3],['stirling',2],['glasgow',2],['inveraray_kilmartin',3],['oban',3],['mull',4],['glencoe',3],['arisaig',2],['skye',5],['torridon',3],['ullapool_assynt',3],['durness',2],['inverness',3],['cairngorms',3]])
      },
      october: {
        18: makeRoute('18 days','1–18 October','A compact west-coast and Skye route with three Edinburgh nights.',[['glasgow',2],['stirling',2],['inveraray_kilmartin',2],['oban',1],['glencoe',3],['skye',3],['perthshire',1],['edinburgh',3]]),
        21: makeRoute('21 days','1–21 October','Adds the Trossachs and a fourth night on Skye.',[['glasgow',2],['stirling',2],['trossachs',1],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',4],['perthshire',1],['edinburgh',3]]),
        24: makeRoute('24 days','1–24 October','Extends east through Loch Ness and Speyside.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',4],['inverness_loch_ness',2],['speyside',2],['edinburgh',2]]),
        28: makeRoute('4 weeks','1–28 October','Adds Mull and Torridon while placing seasonal islands early.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',1],['mull',3],['glencoe',3],['skye',4],['torridon',2],['inverness',2],['speyside',2],['edinburgh',2]]),
        35: makeRoute('5 weeks','1 October–4 November','Adds Mull, Arisaig and Aberdeenshire castle country before finishing in Edinburgh.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',1],['mull',3],['glencoe',3],['arisaig',1],['skye',4],['torridon',2],['inverness_loch_ness',2],['speyside',3],['aberdeenshire',2],['cairngorms',2],['edinburgh',3]]),
        42: makeRoute('6 weeks','1 October–11 November','The full autumn route adds Ullapool and longer eastern bases.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',1],['mull',3],['glencoe',3],['arisaig',1],['skye',4],['torridon',3],['ullapool',3],['inverness_loch_ness',3],['speyside',3],['aberdeenshire',3],['cairngorms',3],['edinburgh',3]])
      },
      november: {
        18: makeRoute('18 days','1–18 November','Ferry-free mainland route with sheltered and indoor alternatives.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['cairngorms',2],['edinburgh',2]]),
        21: makeRoute('21 days','1–21 November','Adds bridge-accessed Skye and Inverness.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',3],['inverness',2],['edinburgh',2]]),
        24: makeRoute('24 days','1–24 November','Adds Speyside for whisky and indoor alternatives.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',3],['inverness',2],['speyside',3],['edinburgh',2]]),
        28: makeRoute('4 weeks','1–28 November','Adds Torridon with a weather-dependent mountain segment.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',4],['torridon',2],['inverness',2],['speyside',2],['cairngorms',2],['edinburgh',2]]),
        35: makeRoute('5 weeks','1 November–5 December','Remote west first, then Speyside, Aberdeenshire, Perthshire and Edinburgh.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',3],['skye',4],['torridon',3],['inverness_loch_ness',2],['cairngorms',2],['speyside',3],['aberdeenshire',2],['perthshire',2],['edinburgh',3]]),
        42: makeRoute('6 weeks','1 November–12 December','Adds Ullapool and longer bases, with the exposed northwest explicitly optional.',[['glasgow',2],['stirling',2],['trossachs',2],['inveraray_kilmartin',2],['oban',2],['glencoe',4],['skye',4],['torridon',3],['ullapool',2],['inverness_loch_ness',3],['cairngorms',3],['speyside',3],['aberdeenshire',3],['perthshire',2],['edinburgh',4]])
      }
    };

    const svg = d3.select(root.querySelector('#route-map'));
    const seasonChoice = root.querySelector('#season-choice');
    const choice = root.querySelector('#route-choice');
    const meta = root.querySelector('#route-meta');
    const stopName = root.querySelector('#stop-name');
    const stopDetail = root.querySelector('#stop-detail');
    const visibleBoundary = {type:'FeatureCollection', features:boundary.features.filter(f => f.properties.name !== 'Shetland Islands')};
    let selectedSeason = seasonChoice.value;
    let selectedRoute = choice.value;
    let selectedStop = 'glencoe';

    function edgeFeature(edge) {
      return {type:'Feature', geometry:{type:'LineString', coordinates:[places[edge[0]].coords, places[edge[1]].coords]}};
    }

    function updateStop(route, key) {
      selectedStop = key;
      const item = route.stops.find(d => d[0] === key);
      const nights = item ? item[1] : 0;
      stopName.textContent = `${places[key].name} · ${nights} ${nights === 1 ? 'night' : 'nights'}`;
      stopDetail.textContent = places[key].detail;
      svg.selectAll('.stop-dot').classed('is-selected', d => d[0] === key);
      svg.selectAll('.stop-number').classed('is-selected', d => d[0] === key);
    }

    function draw() {
      const route = routeSets[selectedSeason][selectedRoute];
      const season = seasonInfo[selectedSeason];
      const width = Math.max(320, root.querySelector('.map-wrap').clientWidth || 736);
      const height = width < 520 ? 490 : Math.min(650, Math.round(width * 0.78));
      svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
      svg.selectAll('*:not(title):not(desc)').remove();

      const projection = d3.geoMercator().fitExtent([[18,18],[width-18,height-28]], visibleBoundary);
      const path = d3.geoPath(projection);
      svg.append('g').selectAll('path').data(visibleBoundary.features).join('path').attr('class','land').attr('d',path);

      const routeLayer = svg.append('g');
      routeLayer.selectAll('.route-halo').data(route.edges).join('path').attr('class','route-halo').attr('d',d => path(edgeFeature(d)));
      routeLayer.selectAll('.route-segment').data(route.edges).join('path').attr('class',d => d[2] === 'ferry' ? 'route-ferry' : 'route-road').attr('d',d => path(edgeFeature(d)));

      const stopLayer = svg.append('g');
      const groups = stopLayer.selectAll('g').data(route.stops).join('g')
        .attr('transform', d => `translate(${projection(places[d[0]].coords).join(',')})`)
        .attr('aria-label', d => `${places[d[0]].name}, ${d[1]} ${d[1] === 1 ? 'night' : 'nights'}`);
      groups.append('circle').attr('class','stop-dot').attr('r',width < 520 ? 10 : 11)
        .attr('data-tooltip', d => `${places[d[0]].name} · ${d[1]} ${d[1] === 1 ? 'night' : 'nights'}`)
        .on('click', (_,d) => updateStop(route,d[0]));
      groups.append('text').attr('class','stop-number text-small').attr('y',0.5).text((d,i) => i+1);

      if (width >= 520) {
        const labelKeys = new Set(['edinburgh','glasgow','glencoe','skye','inverness','ullapool','durness']);
        groups.filter(d => labelKeys.has(d[0])).append('text').attr('class','place-label text-small')
          .attr('x',14).attr('y',-10).text(d => places[d[0]].name);
      }

      svg.append('text').attr('class','map-note text-small').attr('x',12).attr('y',height-8)
        .text(width < 520 ? 'Schematic route overview' : 'Route overview — connections are schematic, not turn-by-turn navigation');

      const totalNights = d3.sum(route.stops,d => d[1]);
      meta.textContent = `${route.dates} · ${totalNights} nights · ${route.stops.length} bases · ${route.summary}`;
      root.querySelector('#route-map-desc').textContent = `${season.label}, ${route.label}, ${route.dates}. ${route.summary} ${season.summary}`;
      if (!route.stops.some(d => d[0] === selectedStop)) selectedStop = route.stops[Math.min(1,route.stops.length-1)][0];
      updateStop(route,selectedStop);
    }

    function updateSelection() {
      selectedSeason = seasonChoice.value;
      selectedRoute = choice.value;
      const route = routeSets[selectedSeason][selectedRoute];
      selectedStop = route.stops[Math.min(1,route.stops.length-1)][0];
      draw();
    }
    seasonChoice.addEventListener('change', updateSelection);
    choice.addEventListener('change', updateSelection);
    new ResizeObserver(draw).observe(root.querySelector('.map-wrap'));
    draw();
  })();
  </script>
</div>
